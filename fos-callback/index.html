<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FinanceOS · Autorizzazione</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#fff; --fg:#1a1a18; --muted:#6b6b66;
    --line:#e4e4df; --accent:#1f4d3a; --err:#a33;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#131312; --card:#1c1c1a; --fg:#ededea; --muted:#9a9a94;
           --line:#2c2c29; --accent:#5fbf94; --err:#e08b8b; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:32px;max-width:460px;width:100%;text-align:center}
  h1{font-size:17px;margin:0 0 8px;font-weight:600}
  p{margin:0 0 6px;color:var(--muted);font-size:14px}
  .spinner{width:26px;height:26px;margin:0 auto 18px;border-radius:50%;
           border:2.5px solid var(--line);border-top-color:var(--accent);
           animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #manual{display:none;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
  code{display:block;margin:10px 0;padding:11px 12px;background:var(--bg);
       border:1px solid var(--line);border-radius:8px;
       font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
       word-break:break-all;text-align:left;user-select:all}
  button{font:inherit;font-size:14px;padding:8px 18px;border-radius:8px;cursor:pointer;
         border:1px solid var(--accent);background:var(--accent);color:#fff}
  button:disabled{opacity:.6;cursor:default}
  .err h1{color:var(--err)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner" id="spin"></div>
  <h1 id="title">Autorizzazione completata</h1>
  <p id="msg">Ti sto riportando su FinanceOS…</p>

  <div id="manual">
    <p>FinanceOS non risponde. Assicurati che l'app sia aperta, oppure copia
       il codice qui sotto e incollalo manualmente nell'app.</p>
    <code id="code"></code>
    <button id="copy">Copia il codice</button>
  </div>
</div>

<script>
(function () {
  var LOCAL = 'http://127.0.0.1:28432/callback';
  var q     = new URLSearchParams(location.search);
  var code  = q.get('code');
  var err   = q.get('error') || q.get('error_description');

  function showManual(text) {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('code').textContent = text;
    document.getElementById('manual').style.display = 'block';
  }

  if (err) {
    document.getElementById('card').className = 'card err';
    document.getElementById('spin').style.display = 'none';
    document.getElementById('title').textContent = 'Autorizzazione non riuscita';
    document.getElementById('msg').textContent = err;
    return;
  }

  if (!code) {
    document.getElementById('spin').style.display = 'none';
    document.getElementById('title').textContent = 'Nessun codice ricevuto';
    document.getElementById('msg').textContent =
      'Apri questa pagina solo al termine del flusso di autorizzazione.';
    return;
  }

  // Se l'app locale non raccoglie il codice entro 2.5s, mostra il fallback manuale.
  var t = setTimeout(function () {
    document.getElementById('msg').textContent = '';
    showManual(code);
  }, 2500);

  document.getElementById('copy').addEventListener('click', function () {
    var b = this;
    navigator.clipboard.writeText(document.getElementById('code').textContent)
      .then(function () { b.textContent = 'Copiato'; b.disabled = true; })
      .catch(function () { b.textContent = 'Copia manualmente'; });
  });

  // Rimbalzo verso il server locale di FinanceOS (porta fissa 28432).
  location.replace(LOCAL + location.search);
})();
</script>
</body>
</html>
